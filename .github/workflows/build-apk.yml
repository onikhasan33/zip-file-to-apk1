name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ZIP if present and build APK
        run: |
          ls -la
          mkdir -p extracted_project
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Extracting $z..."
              unzip -q -o "$z" -d extracted_project
            fi
          done

          GRADLEW_PATH=$(find . -maxdepth 4 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "Found project at: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
            APK_REL_PATH=$(find . -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
            echo "apk_path=$PROJECT_DIR/${APK_REL_PATH#./}" >> "$GITHUB_ENV"
          else
            echo "gradlew not found even after extraction."
            find . -maxdepth 4
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteSupportHost-APK
          path: ${{ env.apk_path }}
